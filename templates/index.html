<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Emotion Predictor</title>
    <style>
        body {
            background-color: #f4f4f4;
            font-family: 'Arial', sans-serif;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            text-align: center;
            background-color: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            max-width: 500px;
            width: 100%;
        }
        h1 {
            color: #4CAF50;
            margin-bottom: 20px;
        }
        textarea {
            width: 100%;
            border: 1px solid #ddd;
            border-radius: 5px;
            padding: 10px;
            margin-bottom: 20px;
            resize: vertical;
            min-height: 100px;
            box-sizing: border-box;
            font-family: inherit;
        }
        button {
            background-color: #4CAF50;
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #45a049;
        }
        .emotion {
            margin-top: 20px;
            padding: 20px;
            border-radius: 8px;
            font-size: 24px;
            font-weight: bold;
            text-transform: uppercase;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Emotion Predictor</h1>
        <form action="/predict" method="post">
            <textarea name="text" rows="4" cols="50" placeholder="Enter text here...">{{ request.form.text if request.form else '' }}</textarea><br>
            <button type="submit">Predict</button>
        </form>
        
        {% if prediction %}
        <div class="emotion">
            {{ prediction }}
        </div>
        {% endif %}
    </div>
</body>
</html>
