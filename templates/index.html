<!DOCTYPE html>
<html>
<head><title>Emotion Predictor</title></head>
<body>
    <h1>Emotion Predictor</h1>
    <form action="/predict" method="post">
        <textarea name="text" rows="4" cols="50"></textarea><br>
        <button>Predict</button>
    </form>
    {% if prediction %}
    <h2>{{ prediction|upper }}</h2>
    {% endif %}
</body>
</html>
